<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | factory.io</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- Encabezado y Navegación -->
  <header>
    <nav>
      <a href="index.html">⚡ factory.io</a>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blog</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
      <a href="carrito.html">🛍️ Carrito</a>
      <a href="login.html">Ingresar</a>
      <a href="registro.html">Registrarse</a>
    </nav>
  </header>

  <!-- Contenido Principal -->
  <main>

    <section>
      <h1>Ingresar</h1>
      <p>Accede con tu correo y contraseña para continuar.</p>
    </section>

    <!-- Sección de ingreso SIN etiqueta <form> -->
    <section>
      <h2>Formulario de ingreso</h2>
      
      <label for="correo">Correo electrónico:</label>
      <input type="text" id="correo">

      <label for="clave">Contraseña:</label>
      <input type="password" id="clave">

      <!-- Botón con evento onclick directo a JavaScript -->
      <button type="button" onclick="validarLogin()">Ingresar</button>

      <!-- Párrafo para mostrar el mensaje de validación -->
      <p id="mensaje"></p>
    </section>

  </main>

  <!-- Pie de página -->
  <footer>
    <p>&copy; 2026 factory.io - Todos los derechos reservados</p>
    <p><a href="nosotros.html">Sobre nosotros</a> | <a href="contacto.html">Contacto</a></p>
  </footer>

  <!-- Archivo de JavaScript -->
  <script src="js/validaciones.js"></script>
</body>
</html>
