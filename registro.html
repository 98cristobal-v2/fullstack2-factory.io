<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro | factory.io</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>

  <header class="encabezado">
    <nav class="barra-navegacion">
      <a href="index.html" class="logo">⚡ factory.io</a>
      <ul class="menu-principal">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blog</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
      <div class="acciones-usuario">
        <a href="carrito.html">🛍️ Carrito</a>
        <a href="login.html">Ingresar</a>
        <a href="registro.html" class="boton activo">Registrarse</a>
      </div>
    </nav>
  </header>

  <section class="hero">
    <h1>Crear cuenta</h1>
    <p>Regístrate para comprar más rápido y guardar tus datos.</p>
  </section>

  <section class="seccion contenedor">
    <h2 class="titulo-seccion">Formulario de registro</h2>
    <form>
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" />

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo" />

      <label for="clave">Contraseña</label>
      <input type="password" id="clave" name="clave" />

      <label for="confirmar">Confirmar contraseña</label>
      <input type="password" id="confirmar" name="confirmar" />

      <button type="submit" class="boton">Registrarse</button>
    </form>
  </section>

  <footer class="pie-pagina">
    <p>&copy; 2026 factory.io - Todos los derechos reservados</p>
    <p><a href="nosotros.html">Sobre nosotros</a> | <a href="contacto.html">Contacto</a></p>
  </footer>

  <script src="js/validaciones.js"></script>
</body>
